<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelaniya BA GPA Calculator</title><style>
:root{--ink:#172554;--muted:#64748b;--line:#dbe5f3;--paper:#ffffff;--bg:#f3f6fc;--blue:#3157d5;--blue2:#6847d8;--teal:#0f9b8e;--green:#087443;--red:#b42332;--soft:#f0f5ff;--shadow:0 10px 28px rgba(28,48,94,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:Arial,"Noto Sans Sinhala",sans-serif;background:radial-gradient(ellipse at top left,#e6edff 0,transparent 42%),linear-gradient(135deg,#f7f9ff,#eef3fb);color:#1e293b;max-width:980px;margin:0 auto;padding:20px 14px 36px;line-height:1.55}
body>h1{margin:0 0 18px;padding:26px 22px;border-radius:22px;color:#fff;font-size:clamp(24px,5vw,34px);letter-spacing:.2px;background:linear-gradient(125deg,#253fa8,#5268e8 55%,#8057d6);box-shadow:0 14px 30px rgba(58,77,180,.22);position:relative;overflow:hidden}body>h1:after{content:"BA";position:absolute;right:18px;top:-20px;font-size:100px;font-weight:900;color:rgba(255,255,255,.10);letter-spacing:-8px;pointer-events:none}
h2{font-size:19px;color:var(--ink);margin:0 0 13px}h3{font-size:18px;line-height:1.45}.card{background:rgba(255,255,255,.96);border:1px solid rgba(209,220,240,.95);border-radius:18px;padding:20px;margin:15px 0;box-shadow:var(--shadow)}.card h2{display:flex;align-items:center;gap:9px}.card h2:before{content:"";width:5px;height:23px;border-radius:8px;background:linear-gradient(var(--blue),var(--blue2));display:inline-block;flex:none}
.note{font-size:13px;color:var(--muted);margin:5px 0 14px}.pickgrid,.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.pickgrid label{font-size:13px;font-weight:700;color:#475569}.pickgrid select{margin-top:7px;width:100%;min-height:44px;background:#f8faff}
select,input,button{font:inherit;padding:10px 11px;border:1px solid #cbd7e9;border-radius:10px;max-width:100%;color:#1e293b;background:#fff;transition:border-color .15s,box-shadow .15s}select:focus,input:focus{outline:none;border-color:#7187ed;box-shadow:0 0 0 3px rgba(81,105,225,.14)}input::placeholder{color:#94a3b8}.row{display:grid;grid-template-columns:minmax(130px,2fr) minmax(90px,1fr) minmax(75px,.7fr) minmax(90px,.9fr);gap:9px;align-items:center;margin:9px 0;padding:10px;background:#f8faff;border:1px solid #e7edf7;border-radius:12px}.row>div b{color:#3349a8;font-size:14px}.row>div{font-size:13px;overflow-wrap:anywhere}.row input,.row select{width:100%;min-width:0}.row input.paper{font-size:13px;text-align:center}.row input.credit{text-align:center}.row select{font-weight:600}.btn{background:linear-gradient(120deg,var(--blue),var(--blue2));color:white;border:0;padding:11px 17px;margin:4px 5px 4px 0;font-weight:700;box-shadow:0 5px 12px rgba(49,87,213,.18);cursor:pointer}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:active{transform:translateY(0)}.stat{background:linear-gradient(145deg,#f7f9ff,#eef3ff);border:1px solid #e1e8fa;border-radius:14px;padding:14px;min-width:0;color:#52617a;font-size:13px}.stat strong{display:block;font-size:clamp(19px,3.5vw,25px);color:#263d9b;margin-top:5px;overflow-wrap:anywhere}.stats .stat:nth-child(4){background:linear-gradient(145deg,#eaf1ff,#e9eaff);border-color:#d7defb}.stats .stat:nth-child(6){background:linear-gradient(145deg,#eafaf5,#edf8ff);border-color:#d3eee6}#result>p{padding:10px 12px;background:#f8fafc;border:1px solid #edf1f6;border-radius:10px;margin:9px 0}.ok{color:var(--green)!important}.bad{color:var(--red)!important}#result h3{padding:14px 16px;border-radius:12px;background:#f6f8ff;border:1px solid #e5eaff}#cbwt .row{margin-top:4px}#gpa1,#gpa2,#gpa3{margin-top:13px;padding:12px 14px;background:#eef3ff;border-radius:10px;color:#344b9e;font-size:14px}#student,#batch{margin:5px 6px 4px 0}section.card p.no-print{margin-bottom:0}
@media(max-width:650px){body{padding:12px 9px 25px}body>h1{padding:22px 16px;border-radius:17px;margin-bottom:13px}.card{padding:14px;margin:11px 0;border-radius:15px}h2{font-size:17px}.pickgrid{grid-template-columns:1fr;gap:10px}.row{grid-template-columns:minmax(0,1.25fr) minmax(70px,.9fr) minmax(52px,.6fr) minmax(72px,.8fr);gap:5px;padding:7px 6px;font-size:12px}.row input,.row select{padding:8px 4px;font-size:12px;border-radius:8px}.row>div{font-size:12px}.row>div b{font-size:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:11px 10px}.stat strong{font-size:21px}#student,#batch{width:100%;margin:5px 0}.btn{width:100%;margin:5px 0}.note{line-height:1.6}}
@media(max-width:390px){body{padding:8px 6px}.card{padding:11px 8px}.row{grid-template-columns:minmax(0,1.1fr) minmax(58px,.85fr) minmax(45px,.55fr) minmax(65px,.75fr);gap:4px}.row input,.row select{font-size:11px;padding:7px 3px}.row>div{font-size:11px}.stat strong{font-size:18px}}
@media print{body{max-width:none;background:#fff;padding:0;color:#111;font-size:10px}body>h1{background:#e8edff!important;color:#172554!important;box-shadow:none;border:1px solid #ccd6ed;padding:12px;font-size:20px}body>h1:after{display:none}.no-print{display:none!important}.card{break-inside:avoid;box-shadow:none;border:1px solid #bbb;border-radius:8px;padding:10px;margin:8px 0}.row{break-inside:avoid;background:#fff;border:1px solid #ddd;padding:5px;margin:4px 0;font-size:9px}.row input,.row select{border:0;padding:3px;background:transparent;font-size:9px}.stats{gap:5px}.stat{background:#f7f7f7!important;border:1px solid #ddd;padding:7px}.stat strong{font-size:15px;color:#111}#gpa1,#gpa2,#gpa3{background:#f4f4f4;border:1px solid #ddd;padding:6px}#result>p{padding:5px;border:0;background:#fff;margin:4px 0}#result h3{background:#fff;border:1px solid #aaa;padding:8px}}
</style></head><body><h1>BA Kelaniya GPA Calculator</h1><section class="card"><h2>ප්‍රධාන විෂයන් 3 තෝරන්න</h2><p class="note">විෂයන් තුන තෝරන්න. වසර තුනටම code පේළි ස්වයංක්‍රීයව පෙන්වයි.</p><div class="pickgrid" id="mainPicks"></div><p class="no-print">නම <input id="student" placeholder="නම"> Batch <input id="batch" placeholder="Batch වර්ෂය"></p></section><div id="years"></div><section class="card"><h2>CBWT (GPA එකට ඇතුළත් නොවේ)</h2><div class="row"><b>CBWT</b><span>Credit 3</span><span></span><select id="cbwt"></select></div></section><section class="card" id="result"><h2>Final Result</h2></section><section class="card no-print"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn" onclick="location.reload()">Reset</button></section><script>
const subjects=[['ARCH','Archaeology'],['TCRM','Tourism and Cultural Resource Management'],['GEOG','Geography'],['POLS','Political Science'],['ECON','Economics'],['HIST','History'],['SOCI','Sociology'],['PHIL','Philosophy'],['PALI','Pali'],['SINH','Sinhala'],['MACO','Mass Communication'],['DVST','Development Studies'],['BUCU','Buddhist Culture'],['BUPH','Buddhist Philosophy'],['CHCU','Christian Culture'],['LING','Linguistics'],['LISC','Library and Information Science'],['SOST','Social Statistics'],['WCCU','Western Classical Culture'],['FNRT','Fine Arts'],['OTHER','Other']];const grades=[['A+',4],['A',4],['A-',3.7],['B+',3.3],['B',3],['B-',2.7],['C+',2.3],['C',2],['C-',1.7],['D+',1.3],['D',1],['E',0]];const gradeOpts='<option value="">Grade</option>'+grades.map(([g,p])=>`<option value="${p}" data-g="${g}">${g}</option>`).join('');const subjOpts='<option value="">විෂය තෝරන්න</option>'+subjects.map(([c,n])=>`<option value="${c}">${c} - ${n}</option>`).join('');for(let i=1;i<=3;i++){let w=document.createElement('label');w.innerHTML=`ප්‍රධාන විෂය ${i}<br><select class="mainpick">${subjOpts}</select>`;document.getElementById('mainPicks').append(w)}for(let y=1;y<=3;y++){let s=document.createElement('section');s.className='card';s.id='y'+y;s.innerHTML=`<h2>${['','First Year','Second Year','Third Year'][y]}</h2><div class="rows"></div><div id="gpa${y}">Year GPA: —</div>`;document.getElementById('years').append(s)}document.getElementById('cbwt').innerHTML=gradeOpts;function selected(){return [...document.querySelectorAll('.mainpick')].map(x=>x.value)}function renderRows(){for(let y=1;y<=3;y++){let h=document.querySelector(`#y${y} .rows`);h.innerHTML='';selected().forEach(code=>{if(!code)return;let name=subjects.find(a=>a[0]===code)?.[1]||code;makeRow(h,y,code,name,4,`${y}8214`);makeRow(h,y,code,name,4,`${y}8224`)});makeRow(h,y,'CBEN','English',3,`${y}8213`);makeRow(h,y,'CBIT','Information Technology',3,`${y}8213`)}calc()}function makeRow(h,y,code,name,cr,paper){let r=document.createElement('div');r.className='row result-row';r.dataset.year=y;r.dataset.code=code;r.innerHTML=`<div><b>${code}</b><br>${name}</div><input class="paper" value="${paper}" aria-label="Paper code"><input class="credit" type="number" min="0" value="${cr}" aria-label="Credit"><select class="grade">${gradeOpts}</select>`;r.querySelectorAll('input,select').forEach(e=>e.addEventListener('change',calc));h.append(r)}document.querySelectorAll('.mainpick').forEach(e=>e.addEventListener('change',renderRows));document.getElementById('cbwt').addEventListener('change',calc);['student','batch'].forEach(id=>document.getElementById(id).addEventListener('input',calc));function calc(){let yr=[],all=[];for(let y=1;y<=3;y++){let w=0,d=0,earned=0;document.querySelectorAll(`#y${y} .result-row`).forEach(r=>{let s=r.querySelector('.grade'),g=s.options[s.selectedIndex]?.dataset.g||'';if(!g)return;let cr=+r.querySelector('.credit').value||0,pt=+s.value;w+=cr*pt;d+=cr;if(g!=='E')earned+=cr;all.push({y,code:r.dataset.code,g,pt,cr,paper:r.querySelector('.paper').value})});yr.push({w,d,gpa:d?w/d:null,earned});document.getElementById('gpa'+y).innerHTML=`<b>Year GPA: ${d?(w/d).toFixed(2):'—'}</b> · GPA credits ${d} · earned credits ${earned}`}let sumW=yr.reduce((a,b)=>a+b.w,0),sumD=yr.reduce((a,b)=>a+b.d,0),final=sumD?sumW/sumD:null,comp=['CBEN','CBIT'].every(c=>{let a=all.filter(x=>x.code===c);return a.length===3&&a.every(x=>x.pt>=2)}),earned=yr.reduce((a,b)=>a+b.earned,0),cb=document.getElementById('cbwt'),cbg=cb.options[cb.selectedIndex]?.dataset.g||'',cbok=cbg!==''&&+cb.value>=2,gpaok=final!==null&&final>=2,creditok=earned>=90;let mainRepeatFail=false,mainRepeatMsg='';for(const code of selected().filter(Boolean)){for(let y=1;y<=3;y++){let a=all.filter(x=>x.code===code&&x.y===y);if(a.length>=2&&a.filter(x=>x.pt<2).length>=2){mainRepeatFail=true;mainRepeatMsg=`${code} (${a[0].paper}, ${a[1].paper}) ${['','First Year','Second Year','Third Year'][y]} දෙකම C grade එකට පහළයි`;}}}let eligible=comp&&cbok&&gpaok&&creditok&&!mainRepeatFail,cl=final===null?'—':final>=3.7?'First Class':final>=3.3?'Second Upper':final>=3?'Second Lower':final>=2?'General Pass':'Not eligible';document.getElementById('result').innerHTML=`<h2>Final Result Sheet</h2><p>Name: ${document.getElementById('student').value||'—'} | Batch: ${document.getElementById('batch').value||'—'}</p><div class="stats"><div class="stat">First Year GPA<strong>${yr[0].gpa?.toFixed(2)||'—'}</strong></div><div class="stat">Second Year GPA<strong>${yr[1].gpa?.toFixed(2)||'—'}</strong></div><div class="stat">Third Year GPA<strong>${yr[2].gpa?.toFixed(2)||'—'}</strong></div><div class="stat">Final GPA<strong>${final===null?'—':final.toFixed(2)}</strong></div><div class="stat">Earned Credits<strong>${earned}</strong></div><div class="stat">Degree Class<strong>${cl}</strong></div></div><p class="${comp?'ok':'bad'}">${comp?'✓':'✗'} CBEN සහ CBIT වසර තුනේම C හෝ ඉහළ</p><p class="${cbok?'ok':'bad'}">${cbok?'✓':'✗'} CBWT C හෝ ඉහළ</p><p class="${creditok?'ok':'bad'}">${creditok?'✓':'✗'} Earned credits අවම 90</p><p class="${gpaok?'ok':'bad'}">${gpaok?'✓':'✗'} Final GPA අවම 2.00</p><p class="${!mainRepeatFail?'ok':'bad'}">${!mainRepeatFail?'✓':'✗'} ${mainRepeatFail?mainRepeatMsg:'ප්‍රධාන විෂයක එකම වසරේ papers දෙකම C grade එකට පහළ නැත'}</p><h3 class="${eligible?'ok':'bad'}">${eligible?'You are selected to BA degree':'You are not selected to BA degree'}</h3><p class="note">GPA ගණනය කරන්නේ ඇතුළත් කළ GPA credit අනුවයි. නිල subject codes තහවුරු කරන්න.</p>`}renderRows();
</script></body></html>
